# Shared definition of every container that runs the Django code (web, worker, beat).
x-django-common: &django-common
  image: filatrucking-django  # one image for web, worker and beat
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    - DATABASE_URL=mysql://filatrucking:${MYSQL_PASSWORD}@mysql:3306/filatrucking
    - SECRET_KEY=${SECRET_KEY}
    - DEBUG=${DEBUG:-False}
    - WHATSAPP_INGEST_SECRET=${WHATSAPP_INGEST_SECRET:?set WHATSAPP_INGEST_SECRET in .env (see .env.example)}
    - WHATSAPP_SIDECAR_URL=http://sidecar:3001
    - CELERY_BROKER_URL=redis://redis:6379/0
    - CELERY_RESULT_BACKEND=redis://redis:6379/0
  volumes:
    - ./FilaTrucking:/app/FilaTrucking
    - ./FilaTrucking/media:/app/FilaTrucking/media
    - staticfiles:/app/FilaTrucking/staticfiles
    - ./.env:/app/.env:ro
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - fila-network

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: fila-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: filatrucking
      MYSQL_USER: filatrucking
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # Port 3306 exposed only for local development - for production use internal network
    # ports:
    #   - "3306:3306"
    networks:
      - fila-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis: Celery broker for the scheduled jobs (QA-008). Internal only, never published.
  redis:
    image: redis:7-alpine
    container_name: fila-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks:
      - fila-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Django Application (web)
  django:
    <<: *django-common
    container_name: fila-django
    ports:
      - "8888:8000"
    command: gunicorn FilaTrucking.wsgi:application --bind 0.0.0.0:8000 --workers 4

  # Celery worker: runs the tasks (statements, recurring invoices, GoMotive sync, ...)
  celery-worker:
    <<: *django-common
    container_name: fila-celery-worker
    command: celery -A FilaTrucking worker -l info --concurrency 2

  # Celery beat: the scheduler that fires the jobs listed in settings.CELERY_BEAT_SCHEDULE
  celery-beat:
    <<: *django-common
    container_name: fila-celery-beat
    command: celery -A FilaTrucking beat -l info --schedule /tmp/celerybeat-schedule

  # WhatsApp Sidecar (Node.js)
  sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: fila-whatsapp-sidecar
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DJANGO_API_URL=http://django:8000/shipments/api/ingest/
      - DJANGO_SECRET=${WHATSAPP_INGEST_SECRET:?set WHATSAPP_INGEST_SECRET in .env (see .env.example)}
    volumes:
      - auth_data:/app/sidecar/auth_data
    # No published port (QA-002): only Django, on the compose network, talks to the sidecar.
    expose:
      - "3001"
    depends_on:
      - django
    networks:
      - fila-network

  # Nginx Reverse Proxy (optional - for future HTTPS)
  nginx:
    image: nginx:alpine
    container_name: fila-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/staticfiles
      - ./FilaTrucking/media:/media:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"  # Uncomment when you have SSL certificates
    depends_on:
      - django
    networks:
      - fila-network

  certbot:
    image: certbot/certbot
    container_name: fila-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "
      trap exit TERM;
      while :; do
        certbot renew;
        sleep 12h & wait $${!};
      done
      "


networks:
  fila-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  auth_data:
  staticfiles:
  certbot_www:
  certbot_conf: